name: CI
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: Hezric/Linen/.github/workflows/windows-checks.yml@v0.1.5
    with:
      manifest: src-tauri/Cargo.toml
      frontend: true
      build-command: vp exec tauri build --ci --no-bundle -- --locked
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install chromium
      - run: vp run test:browser
  test:
    needs: [verify, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.verify.result }}' = success
      - run: test '${{ needs.browser.result }}' = success
  policy-check:
    uses: Hezric/Linen/.github/workflows/project-policy.yml@v0.1.5
  policy:
    needs: policy-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.policy-check.result }}' = success
  recovery-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - if: always()
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-recovery-source
          path: |
            src-tauri/src/core.rs
            src-tauri/src/wifi.rs
            src-tauri/tests/reconnect.rs
